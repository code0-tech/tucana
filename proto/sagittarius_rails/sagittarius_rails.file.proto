syntax = "proto3";

option ruby_package = "Tucana::Sagittarius::Rails";

package sagittarius_rails;

import "shared.errors.proto";
import "shared.file.proto";

message GetFileDownloadUrlRequest {
  // Database id of the storage object
  int64 id = 1;
  int64 project_id = 2;
  string execution_identifier = 3;
}

message GetFileDownloadUrlResponse {
  // Short-lived signed download URL
  string url = 1;
  shared.FileMetadata file = 2;
  optional shared.ServiceError error = 3;
}

service FileService {
  // Called by Gateway
  rpc GetFileDownloadUrl (GetFileDownloadUrlRequest) returns (GetFileDownloadUrlResponse) {}
}
