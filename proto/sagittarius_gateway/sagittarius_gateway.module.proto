syntax = "proto3";

option ruby_package = "Tucana::Sagittarius::Gateway";

package sagittarius_gateway;

import "shared.errors.proto";
import "shared.module.proto";

// Request for updating a list of modules including data types, flow types and runtime function definitions
message ModuleUpdateRequest {
  // List of modules
  repeated shared.Module modules = 1;
  // List of all available modules of this runtime
  repeated string available_definition_sources = 2;
}

// Response of updating modules including data types, flow types and runtime function definitions
message ModuleUpdateResponse {
  // True if was successful, false if not
  bool success = 1;
  optional shared.ServiceError error = 2;
}

message ModuleConfigurationRequest {

}

message ModuleConfigurationResponse {
  shared.ModuleConfigurations module_configurations = 1;
}

message ModuleConfigurationPushRequest {
  int64 runtime_identifier = 1;
  ModuleConfigurationResponse response = 2;
}

message ModuleConfigurationPushResponse {
}

//This service will be implemented as a server by Sagittarius and as a client by Aquila.
service ModuleService {
  // Aquila will call this method to update modules
  rpc Update(ModuleUpdateRequest) returns (ModuleUpdateResponse) {}
  // Aquila will call this method to open a stream to receive module configurations
  rpc Configurations(ModuleConfigurationRequest) returns (stream ModuleConfigurationResponse) {}

  // Sagittarius will call this method push new module configurations to aquila
  rpc Push(ModuleConfigurationPushRequest) returns (ModuleConfigurationPushResponse) {}
}
