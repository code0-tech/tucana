syntax = "proto3";

option ruby_package = "Tucana::Shared";

package shared;

import "shared.struct.proto";
import "shared.errors.proto";
import "shared.flow.proto";

message SubFlowFunctionResult {

  shared.SubFlowFunction function = 1;
  shared.Struct input_schema = 2;
  shared.Struct output_schema = 3;
  string name = 4;
  string description = 5;

}

message NodeValueExecutionResult {

  oneof value {
    shared.Value raw_value = 1;
    SubFlowFunctionResult sub_flow_function_result = 2;
  }

}

message NodeExecutionResult {

  oneof id {
    int64 node_id = 1;
    string function_identifier = 2;
  }

  int64 started_at = 3;
  int64 finished_at = 4;

  repeated NodeValueExecutionResult parameter_results = 5;

  oneof result {
    NodeValueExecutionResult success = 6;
    shared.Error error = 7;
  }

}

message ExecutionResult {

  string execution_identifier = 1;
  int64 flow_id = 2;
  int64 started_at = 3;
  int64 finished_at = 4;
  shared.Value input = 5;

  repeated NodeExecutionResult node_execution_results = 6;

  // Result of executed flow
  oneof result {
    shared.Value success = 7;
    shared.Error error = 8;
  }

}
