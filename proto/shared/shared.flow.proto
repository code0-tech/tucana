syntax = "proto3";

option ruby_package = "Tucana::Shared";

package shared;

import "shared.struct.proto";
import "shared.data_type.proto";
import "shared.translation.proto";

message ValidationFlow {
  // Database ID -> req. for Aquila to identify in FlowStore
  int64 flow_id = 1;
  int64 project_id = 2;
  // The FlowType´s identifier
  string type = 3;
  // All custom data types used in this flow
  repeated shared.ExecutionDataType data_types = 4;
  repeated FlowSetting settings = 5;
  int64 starting_node_id = 6;
  repeated NodeFunction node_functions = 7;
  string project_slug = 8;
  optional string disable_reason = 9;
  string signature = 10;

  optional string definition_source = 11;
  shared.Struct input_schema = 12;
  shared.Struct output_schema = 13;

  string name = 14;
}

message ExecutionFlow {
  // Database ID -> req. for Aquila to identify in FlowStore
  int64 flow_id = 1;
  int64 project_id = 5;
  int64 starting_node_id = 2;
  repeated NodeFunction node_functions = 4;
  optional shared.Value input_value = 3;
}

message GenerationFlow {
  string name = 1;
  string type = 2;
  string starting_node_id = 3;
  repeated NodeFunction node_functions = 4;
  repeated FlowSetting settings = 5;
}

message FlowSetting {
  // The database id from sagittarius
  optional int64 database_id = 1;
  string flow_setting_id = 2;
  shared.Value value = 3;
  optional string cast = 4;
}

message NodeFunction {
  // The database id from sagittarius
  optional int64 database_id = 1;
  string runtime_function_id = 2;
  repeated NodeParameter parameters = 3;
  optional int64 next_node_id = 4;
  optional string definition_source = 5;
}

message NodeValue {
  oneof value {
    LiteralValue literal_value = 1;
    ReferenceValue reference_value = 2;
    SubFlow sub_flow = 3;
  }
}

// A literal value that may contain inline references.
//
// `value` behaves like a template: any occurrence of `${signature}` inside a
// (possibly nested) string value gets substituted with the resolved value of
// the reference whose `signature` matches. A single LiteralValue can hold as
// many references as needed.
message LiteralValue {
  // The raw value. String values may contain `${signature}` placeholders that
  // are resolved from `references`.
  shared.Value value = 1;
  // Inline references addressable via `${signature}` inside `value`.
  repeated InlineReferenceValue references = 2;
}

// A single inline reference of a LiteralValue.
//
// `signature` is the key used inside `value` via the `${signature}` syntax.
// The referenced value is again a NodeValue, so it can be a LiteralValue
// (allowing nested references), a ReferenceValue or a SubFlow.
message InlineReferenceValue {
  // The key addressed via `${signature}`.
  string signature = 1;
  // The value this reference resolves to.
  NodeValue value = 2;
}

message NodeParameter {
  // The database id from sagittarius
  int64 database_id = 1;
  string runtime_parameter_id = 2;
  NodeValue value = 3;
  optional string cast = 4;
}

message ReferenceValue {
  oneof target {
    // Ref Value points to flow input
    FlowInput flow_input = 1;
    // Ref Value points to a Result of a node, the int is the id of the node
    int64 node_id = 2;
    // Points to Value that is contained inside of a node
    InputType input_type = 3;
  }
  repeated ReferencePath paths = 4;
}

message SubFlowFunction {
  string function_identifier = 1;
  optional string definition_source = 2;
}

message SubFlow {
  oneof execution_reference {
    int64 starting_node_id = 1;
    SubFlowFunction function = 2;
  }

  shared.Struct input_schema = 3;
  shared.Struct output_schema = 4;
  string signature = 5;
  repeated SubFlowSetting settings = 6;
}

message SubFlowSetting {
  string identifier = 1;
  optional shared.Value default_value = 2;
  optional bool optional = 3;
  optional bool hidden = 4;
}

message FlowInput {}

message InputType {
  // Id of the node
  int64 node_id = 1;
  // Index of the parameter inside the function
  int64 parameter_index = 2;
  // Index of the input type of the data type
  int64 input_index = 3;
}

message ReferencePath {
  optional string path = 1;
  optional int64 array_index = 2;
}

// Used in sagittarius´s FlowService because oneof can only
// take in a single message type and not a repeated one
message Flows {
  repeated ValidationFlow flows = 1;
}
