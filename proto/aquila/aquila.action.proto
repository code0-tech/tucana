syntax = "proto3";

option ruby_package = "Tucana::Aquila";

package aquila;

import "shared.module.proto";
import "shared.execution_result.proto";
import "shared.struct.proto";
import "shared.flow.proto";
import "shared.translation.proto";
import "shared.errors.proto";

message ActionFlow {
  int64 flow_id = 1;
  int64 project_id = 2;

  repeated shared.FlowSetting settings = 3;
  shared.Struct input_schema = 4;
  shared.Struct output_schema = 5;
  string project_slug = 6;

  string name = 7;
}

// Event that gets admitted by an action
message ActionEvent {
  // Id of Event type
  string event_type = 1;
  // Project Id that this event is emitted for
  int64 project_id = 2;
  // Payload (JSON) of event params
  shared.Value payload = 3;
}

// Action flow/event configuration
message ActionLogon {
  enum ScalingOption {
    UNKNOWN = 0;
    // Send all Flows/Project Configurations to all Actions of this type
    DISABLED = 1;
    // Split all Flows/Project Configurations between all available Actions of this type
    SPLIT = 2;
  }
  // Action identifier
  shared.Module module = 1;
  ScalingOption scaling_option = 2;
}

// Reference to a sub flow whose result is used as a parameter value
message ActionNodeSubFlowValue {
  // Execution identifier of the sub flow execution
  string execution_identifier = 1;
}

// A single parameter value of a function
message ActionNodeValue {
  oneof value {
    // A literal, already resolved value
    shared.Value literal_value = 1;
    // A value that is produced by executing a sub flow
    ActionNodeSubFlowValue sub_flow = 2;
  }
}

// Request to execute a request a flow
message ActionExecutionRequest {
  // Execution identifier of execution
  string execution_identifier = 1;
  // Function identifier of flow to execute
  string function_identifier = 2;
  // Parameters of functions required to execute
  repeated ActionNodeValue parameters = 3;
  // Project Id that this function is emitted for
  int64 project_id = 4;
}

// Request to execute a sub flow
message ActionSubFlowExecutionRequest {
  // Execution identifier of execution
  string execution_identifier = 1;
  //parameters for the sub flow to inject
  repeated shared.Value parameters = 2;
}

// Result of a sub flow execution
message ActionSubFlowExecutionResponse {
  // Execution identifier of execution
  string execution_identifier = 1;
  oneof result {
    // Successful result of the sub flow execution
    shared.Value success = 2;
    // Error that occurred during the sub flow execution
    shared.Error failure = 3;
  }
}

message ActionFlowExecutionRequest {
  string execution_identifier = 1;
  string flow_id = 2;
  shared.Value payload = 3;
}

message ActionExecutionResponse {
  // Execution identifier of execution
  string execution_identifier = 1;
  // Result of execution
  shared.NodeExecutionResult node_result = 2;
}

message ActionFlowExecutionResponse {
  // Execution identifier of execution
  string execution_identifier = 1;
  oneof result {
    shared.Value success = 2;
    shared.Error failure = 3;
  }
}

message ActionFlowUpdate {
  oneof data {
    ActionFlow updated_flow = 1;
    int64 deleted_flow = 2;
  }
}

// Messages sent by the Action
message ActionTransferRequest {
  oneof data {
    // Identification of the action
    //
    // Expected behavior:
    // Aquila will abort if the first request is not an ActionLogon
    ActionLogon logon = 1;
    // Event that got admitted
    ActionEvent event = 2;
    // Result of execution that was triggered by a execution request
    ActionExecutionResponse result = 3;
    // Request to execute a sub flow
    ActionSubFlowExecutionRequest sub_flow_execution = 4;
  }
}

// Messages sent by Aquila
message ActionTransferResponse {
  oneof data {
    // Execution request
    ActionExecutionRequest execution = 1;
    // ModuleConfigurations that have been configured by the user
    shared.ModuleConfigurations module_configurations = 2;
    // An Action Flow update
    ActionFlowUpdate flow_update = 3;
    // Result of an flow execution
    ActionFlowExecutionResponse flow_execution_response = 4;
    // Result of a sub flow execution
    ActionSubFlowExecutionResponse sub_flow_execution_response = 5;
  }
}

service ActionTransferService {
  // This behavior achieves a bi-directional stream so that both services aren't required to be a server & client on their own
  rpc Transfer (stream ActionTransferRequest) returns (stream ActionTransferResponse);
}
