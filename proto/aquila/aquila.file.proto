syntax = "proto3";

option ruby_package = "Tucana::Aquila";

package aquila;

import "shared.errors.proto";
import "shared.file.proto";

// Sent by an action that wants to upload a file
message FileUploadUrlRequest {
  string file_name = 1;
  string content_type = 2;
  // epoch timestamp in milliseconds, the file is deleted afterwards. Unset keeps the file forever
  optional int64 expires_at = 3;
  int64 project_id = 4;
  string execution_identifier = 5;
}

message FileUploadUrl {
  // Database id of the storage object the upload is bound to
  int64 id = 1;
  // Signed URL accepting a single HTTP PUT with the raw file content as body.
  // The response body is the committed file metadata as JSON
  string url = 2;
  // epoch timestamp in milliseconds after which the url is rejected
  int64 url_expires_at = 3;
}

message FileUploadUrlResponse {
  oneof data {
    FileUploadUrl upload = 1;
    shared.Error failure = 2;
  }
}

// Sent by an action that wants to download a file
message FileDownloadUrlRequest {
  // Database id of the storage object
  int64 id = 1;
  int64 project_id = 2;
  string execution_identifier = 3;
}

message FileDownloadUrl {
  // Signed URL serving the file content via HTTP GET
  string url = 1;
  // epoch timestamp in milliseconds after which the url is rejected
  int64 url_expires_at = 2;
  shared.FileMetadata file = 3;
}

message FileDownloadUrlResponse {
  oneof data {
    FileDownloadUrl download = 1;
    shared.Error failure = 2;
  }
}

// Served by Aquila to actions. File content never passes through gRPC, actions transfer it via the signed URLs
service ActionFileService {
  rpc RequestUpload (FileUploadUrlRequest) returns (FileUploadUrlResponse) {}

  rpc RequestDownload (FileDownloadUrlRequest) returns (FileDownloadUrlResponse) {}
}
